name: AutoRAG checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _autorag_conceito_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '_autorag_conceito_build/requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run check
      - run: npm test
